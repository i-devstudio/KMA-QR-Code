<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMA Cosmetics | Social Hub</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="KMA_LOGO_Square.png">
</head>
<body>
    <div class="background-decor">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="container">
        <header class="header animate-fade-in">
            <!-- KMA Logo Area (Using Brand Image Logo) -->
            <div class="logo-container">
                <img src="KMA_LOGO_Black_0.png" alt="KMA Cosmetics" class="kma-logo-img">
            </div>
            
            <!-- <h1 class="headline">Follow KMA</h1> -->
            <p class="subheadline">ติดตามข่าวสาร โปรโมชัน และเทคนิคความงามจาก KMA</p>
        </header>

        <main class="social-channels animate-slide-up">
            <!-- LINE OA -->
            <a href="#" class="social-btn line-btn" data-social="LINE" id="btn-line">
                <div class="icon-wrapper">
                    <!-- LINE SVG Icon (Corrected Standard Version) -->
                    <svg viewBox="0 0 16 16" class="social-icon" fill="currentColor">
                        <path d="M9.048 5.727c0-.282.229-.511.512-.511h1.246a.512.512 0 1 1 0 1.022H9.56v1.671h1.246a.512.512 0 1 1 0 1.022H9.56v1.73h1.246a.512.512 0 1 1 0 1.022H9.56a.512.512 0 0 1-.512-.512V5.727zM0 8c0 4.41 3.59 8 8 8 4.41 0 8-3.59 8-8s-3.59-8-8-8C3.59 0 0 3.59 0 8zm8.115-3.332a.498.498 0 0 1 .498.498v5.668a.498.498 0 0 1-.996 0V5.166a.498.498 0 0 1 .498-.498zm-4.004.498v5.668c0 .275-.223.498-.498.498H2.33a.498.498 0 0 1-.498-.498V5.166c0-.275.223-.498.498-.498a.498.498 0 0 1 .498.498v5.17h1.283zm1.968-.498a.498.498 0 0 1 .38.188l2.001 3.036v-2.726a.498.498 0 1 1 .996 0v5.668a.498.498 0 0 1-.383-.188l-1.998-3.035v2.725a.498.498 0 1 1-.996 0V5.166a.498.498 0 0 1 .498-.498z"/>
                    </svg>
                </div>
                <span class="social-name">LINE OA</span>
                <span class="social-action">เพิ่มเพื่อน</span>
                <div class="arrow-wrapper">
                    <svg viewBox="0 0 24 24" class="arrow-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </a>

            <!-- TikTok -->
            <a href="#" class="social-btn tiktok-btn" data-social="TikTok" id="btn-tiktok">
                <div class="icon-wrapper">
                    <!-- TikTok SVG Icon -->
                    <svg viewBox="0 0 24 24" class="social-icon" fill="currentColor">
                        <path d="M12.525.02c1.31-.03 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.06-2.89-.52-4.06-1.39-.77-.57-1.39-1.33-1.89-2.18v7.58c.02 1.83-.53 3.69-1.72 5.07-1.45 1.75-3.88 2.62-6.13 2.22-2.28-.35-4.32-2.02-5.06-4.22-.96-2.73-.24-6.06 1.89-7.98 1.6-1.49 3.86-2.17 6-1.77v4.1c-1.12-.34-2.39-.08-3.23.74-.83.78-1.11 2.05-.68 3.12.39 1.05 1.51 1.78 2.62 1.71 1.25.02 2.37-.91 2.53-2.15.06-.5.03-1.02.03-1.52V.02z"/>
                    </svg>
                </div>
                <span class="social-name">TikTok</span>
                <span class="social-action">ติดตามเรา</span>
                <div class="arrow-wrapper">
                    <svg viewBox="0 0 24 24" class="arrow-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </a>

            <!-- Facebook -->
            <a href="#" class="social-btn facebook-btn" data-social="Facebook" id="btn-facebook">
                <div class="icon-wrapper">
                    <!-- Facebook SVG Icon -->
                    <svg viewBox="0 0 24 24" class="social-icon" fill="currentColor">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </div>
                <span class="social-name">Facebook</span>
                <span class="social-action">ถูกใจเพจ</span>
                <div class="arrow-wrapper">
                    <svg viewBox="0 0 24 24" class="arrow-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </a>

            <!-- Instagram -->
            <a href="#" class="social-btn instagram-btn" data-social="Instagram" id="btn-instagram">
                <div class="icon-wrapper">
                    <!-- Instagram SVG Icon -->
                    <svg viewBox="0 0 24 24" class="social-icon" fill="currentColor">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
                    </svg>
                </div>
                <span class="social-name">Instagram</span>
                <span class="social-action">ติดตามเรา</span>
                <div class="arrow-wrapper">
                    <svg viewBox="0 0 24 24" class="arrow-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </a>
        </main>

        <footer class="footer animate-fade-in" style="animation-delay: 0.4s;">
            <p class="copyright">&copy; 2026 KMA Cosmetics. All Rights Reserved.</p>
        </footer>
    </div>

    <!-- JS Logic -->
    <script src="js/app.js"></script>
</body>
</html>
